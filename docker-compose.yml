# clearmock — drop-in clearinghouse simulator.
# The SFTP container is the wire-level stand-in: the system under test uploads
# 270/837 files exactly as it would to the real clearinghouse, and polls the
# same outbound directory for 271/999/277CA/835 responses. The engine watches
# the shared volume between them.
services:
  engine:
    build: .
    ports: ["8090:8090"]          # control UI + /api/inject
    volumes:
      - edi:/data
      - ./stubs:/app/stubs        # edit stubs live, hit "reload stubs" in the UI
      - ./templates:/app/templates
    environment:
      CM_INBOUND: /data/inbound
      CM_OUTBOUND: /data/outbound

  sftp:
    image: atmoz/sftp:alpine
    ports: ["2222:22"]
    volumes:
      - edi:/home/clearmock/data
    # user:password:uid:gid — matches the credentials you put in the app's config
    command: clearmock:clearmock:1001:1001

volumes:
  edi:
