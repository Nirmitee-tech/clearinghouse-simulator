description: "Claim status inquiry (276): PENDING on the first ask, FINALIZED on the next — the poll loop most billing systems get wrong."
priority: 50
match:
  transaction: "276"
sequenceKey: patientControlNumber
sequence:
  - { transaction: "277", delay: 10s, template: 277ca-accepted.hbs, values: { statusCode: "A2:20", statusText: "PENDING ADJUDICATION" } }
  - { transaction: "277", delay: 10s, template: 277ca-accepted.hbs, values: { statusCode: "F1:1",  statusText: "FINALIZED - PAID" } }

scenario:
  title: "Claim status: pending, then finalized"
  group: Claims
  outcome: "Ask for status once and it reads pending; ask again and it reads finalized. Use it to test a polling loop."
  patient:
    firstName: AVERY
    lastName: TESTFIELD
    dob: "1988-03-14"
    gender: F
    memberId: "881234561"
    payerName: MERIDIAN HEALTH PLAN
    payerId: "00455"
