    firstName: AVERY
    lastName: TESTFIELD
    dob: "1988-03-14"
    gender: F
    memberId: "881234561"
    payerName: MERIDIAN HEALTH PLAN
    payerId: "00455"
  service:
    charge: "200.00"
    cpt: "96156"
