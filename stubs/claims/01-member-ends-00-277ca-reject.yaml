description: "Member ID ending 00 → 999 accepted, then 277CA rejects: subscriber not found. The classic 'retry cannot fix data' case."
priority: 20
match:
  transaction: "837"
  memberId: { endsWith: "00" }
respond:
  - transaction: "999"
    delay: 30s
    template: 999-accept.hbs
  - transaction: "277"
    delay: 3m
    template: 277ca-rejected.hbs
    values:
      rejectCode: "A3:33"
      rejectText: "SUBSCRIBER ID NOT FOUND IN PAYER RECORDS"

scenario:
  title: "Payer rejects the claim — member ID wrong"
  group: Claims
  outcome: "Passes the format check, then the payer rejects it: subscriber not found. Retrying will not fix it — the member ID has to be corrected."
  patient:
    firstName: CASEY
    lastName: NOMATCH
    dob: "1995-06-21"
    gender: F
    memberId: "881234500"
    payerName: MERIDIAN HEALTH PLAN
    payerId: "00455"
  service:
    charge: "200.00"
    cpt: "90837"
