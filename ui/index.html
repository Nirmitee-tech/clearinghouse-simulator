<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>clearmock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fbfbfc;--card:#fff;--ink:#1a1f26;--muted:#67717d;--line:#e3e7eb;--accent:#186a83;--accent-soft:#e8f2f5;--ok:#1c7a52;--code:#f3f5f7}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161a;--card:#1a2026;--ink:#e7edf2;--muted:#98a4b0;--line:#2a333c;--accent:#63bcd6;--accent-soft:#16303a;--ok:#5cc795;--code:#1f262d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif}
header{padding:20px 26px 15px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
h1{font-size:1.1rem;font-weight:600;margin:0}
header p{margin:0;color:var(--muted);font-size:.88rem}
header .sp{margin-left:auto;color:var(--muted);font-size:.82rem}
select{font:inherit;font-size:.82rem;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
main{max-width:900px;margin:0 auto;padding:22px 26px 60px}
h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:600;margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:22px}
.gname{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 0 5px}
.gname:first-of-type{margin-top:4px}
label.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:7px;cursor:pointer}
label.opt:hover{background:var(--accent-soft)}
label.opt input{margin-top:4px;flex:none}
label.opt .t{font-weight:500;font-size:.93rem}
label.opt .o{color:var(--muted);font-size:.85rem}
.go{margin-top:14px;display:flex;gap:10px;align-items:center}
button.primary{font:inherit;font-weight:500;padding:8px 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}
.pt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.pt .who{font-weight:600}
.pt .meta{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:7px}
.f{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg);display:flex;align-items:center;gap:8px}
.f .k{font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.f .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.9rem}
.f button,.mini{margin-left:auto;flex:none;font:inherit;font-size:.72rem;padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.f button:hover,.mini:hover{border-color:var(--accent);color:var(--accent)}
.f button.done{color:var(--ok);border-color:var(--ok)}
.binds{margin-top:11px;font-size:.87rem}
.binds .b{padding:4px 0;color:var(--muted)}
.binds .b b{color:var(--ink);font-weight:500}
.acts{margin-top:10px;display:flex;gap:7px}
.empty{color:var(--muted);font-size:.88rem}
.log .row{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:.85rem;border-bottom:1px solid var(--line)}
.log .row:last-child{border-bottom:0}
.log .tag{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--accent);min-width:32px}
.log .when{color:var(--muted);font-size:.78rem;margin-left:auto;white-space:nowrap}
</style></head><body>
<header>
  <h1>clearmock</h1>
  <p>Pick what should happen, generate a patient, use those details in your app.</p>
  <span class="sp">responses arrive <select id="speed">
    <option value="10000">instantly</option><option value="600" selected>fast</option><option value="60">1 min ≈ real</option><option value="1">real time</option>
  </select></span>
</header>
<main>
  <div class="panel">
    <h2>New test patient</h2>
    <div id="opts"></div>
    <div class="go">
      <button class="primary" id="gen" disabled>Generate patient</button>
      <span class="empty" id="genhint">Choose one or more outcomes above.</span>
    </div>
  </div>

  <h2>Your test patients</h2>
  <div id="patients"><div class="empty">None yet.</div></div>

  <div style="margin-top:30px">
    <h2>Recent requests</h2>
    <div class="log" id="log"><div class="empty">Nothing yet.</div></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=u=>fetch(u).then(r=>r.json());
let stubs=[];

function field(k,v){return `<div class="f"><div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>
  <button data-copy="${esc(v)}">copy</button></div>`;}

function optionRow(s){
  return `<label class="opt"><input type="checkbox" value="${esc(s.id)}">
    <span><span class="t">${esc(s.scenario.title)}</span><br><span class="o">${esc(s.scenario.outcome)}</span></span></label>`;
}

function patientCard(p){
  const dob=p.dob;
  return `<div class="pt">
    <div class="who">${esc(p.firstName)} ${esc(p.lastName)}</div>
    <div class="meta">created ${new Date(p.createdAt).toLocaleString()}</div>
    <div class="grid">
      ${field('First name',p.firstName)}${field('Last name',p.lastName)}
      ${field('Date of birth',dob)}${field('Sex',p.gender)}
      ${field('Member ID',p.memberId)}${field('Payer',p.payerName)}${field('Payer ID',p.payerId)}
    </div>
    <div class="binds">${p.bindings.map(b=>{
      const names=b.scenarios.map((s,i)=>b.scenarios.length>1?`${i+1}. ${esc(s.title)}`:esc(s.title));
      const label=b.transaction==='270'?'Insurance check':b.transaction==='837'?'Claim':b.transaction==='276'?'Claim status':'Any request';
      return `<div class="b"><b>${label}:</b> ${names.join(' → ')}${b.hits?` · used ${b.hits}×`:''}</div>`;
    }).join('')}</div>
    <div class="acts">
      <button class="mini" data-reset="${esc(p.id)}">reset counters</button>
      <button class="mini" data-del="${esc(p.id)}">delete</button>
    </div></div>`;
}

async function draw(){
  const [st,pats,traffic]=await Promise.all([get('/api/stubs'),get('/api/patients'),get('/api/traffic')]);
  stubs=st.filter(s=>s.scenario);
  if(!$('#opts').dataset.built){
    const groups={};
    for(const s of stubs)(groups[s.scenario.group||'Other'] ??= []).push(s);
    $('#opts').innerHTML=Object.entries(groups).map(([g,list])=>
      `<div class="gname">${esc(g)}</div>`+list.map(optionRow).join('')).join('');
    $('#opts').dataset.built='1';
  }
  $('#patients').innerHTML=pats.length?pats.map(patientCard).join(''):'<div class="empty">None yet.</div>';
  $('#log').innerHTML=traffic.length?traffic.slice(0,8).map(e=>{
    const sc=stubs.find(s=>s.id===e.matchedStub)?.scenario;
    return `<div class="row"><span class="tag">${esc(e.transaction)}</span>
      <span>${esc(sc?sc.title:(e.matchedStub||'no scenario matched'))}</span>
      <span class="when">${new Date(e.at).toLocaleTimeString()}</span></div>`;}).join('')
    :'<div class="empty">Nothing yet.</div>';
}

document.addEventListener('change',ev=>{
  if(ev.target.matches('#opts input')){
    const n=document.querySelectorAll('#opts input:checked').length;
    $('#gen').disabled=!n;
    $('#genhint').textContent=n?`${n} outcome${n>1?'s':''} selected — several for the same request type play out in order.`:'Choose one or more outcomes above.';
  }
});
document.addEventListener('click',async ev=>{
  const c=ev.target.closest('[data-copy]'),d=ev.target.closest('[data-del]'),r=ev.target.closest('[data-reset]');
  if(c){await navigator.clipboard.writeText(c.dataset.copy);c.textContent='copied';c.classList.add('done');
    setTimeout(()=>{c.textContent='copy';c.classList.remove('done')},1200);return;}
  if(d){await fetch('/api/patients/'+d.dataset.del,{method:'DELETE'});return draw();}
  if(r){await fetch('/api/patients/'+r.dataset.reset+'/reset',{method:'POST'});return draw();}
});
$('#gen').onclick=async()=>{
  const scenarios=[...document.querySelectorAll('#opts input:checked')].map(i=>i.value);
  await fetch('/api/patients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenarios})});
  document.querySelectorAll('#opts input:checked').forEach(i=>i.checked=false);
  $('#gen').disabled=true; $('#genhint').textContent='Choose one or more outcomes above.';
  draw();
};
$('#speed').onchange=e=>fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({speed:Number(e.target.value)})});
draw(); setInterval(draw,3000);
</script></body></html>
